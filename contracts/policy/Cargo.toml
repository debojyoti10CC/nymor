[workspace]
resolver = "2"
members = ["account", "spending-limit-policy"]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Nymor"]
license = "MIT"
publish = false

[workspace.dependencies]
# Pinned to match what the latest crates.io-published stellar-accounts
# (0.7.2) actually depends on internally (26.1.1) — the OZ git repo's
# workspace Cargo.toml pins soroban-sdk 27.0.2, but that's ahead of what's
# published; using 27.x here caused two soroban-sdk major versions in one
# wasm binary and a duplicate `panic_impl` lang item.
soroban-sdk = { version = "26.1.1" }
stellar-accounts = "0.7.2"
stellar-contract-utils = "0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
